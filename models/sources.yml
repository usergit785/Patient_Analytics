          - name: placer_order_number
            description: "Placer order number"
          - name: filler_order_number
            description: "Filler order number"
          - name: universal_service_id
            description: "Universal service identifier"
          - name: priority
            description: "Priority of the order"
          - name: requested_datetime
            description: "Date and time order was requested"
          - name: observation_datetime
            description: "Date and time of observation"
          - name: ordering_provider
            description: "Provider who placed the order"
          - name: result_copies_to
            description: "Recipients of result copies"
          - name: parent_order
            description: "Parent order reference"
          - name: order_status
            description: "Status of the order"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processed_at
            description: "Timestamp when record was processed"

      - name: patients
        description: "Patient demographic information from HL7 messages"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: patient_id
            description: "Unique patient identifier"
          - name: patient_name
            description: "Full patient name"
          - name: last_name
            description: "Patient last name"
          - name: first_name
            description: "Patient first name"
          - name: middle_name
            description: "Patient middle name"
          - name: mother_maiden_name
            description: "Mother's maiden name"
          - name: date_of_birth
            description: "Patient date of birth"
          - name: gender
