version: 2

sources:
  - name: hl7
    description: "HL7 schema containing healthcare data in HL7 message format"
    database: raw_db
    schema: hl7
    tables:
      - name: allergies
        description: "Patient allergy information from HL7 messages"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: patient_id
            description: "Unique patient identifier"
          - name: allergy_type
            description: "Type of allergy"
          - name: allergen
            description: "Allergen causing the reaction"
          - name: severity
            description: "Severity level of the allergy"
          - name: reaction_code
            description: "Code representing the allergic reaction"
          - name: identification_date
            description: "Date when allergy was identified"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processed_at
            description: "Timestamp when record was processed"

      - name: diagnoses
        description: "Patient diagnosis information from HL7 messages"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: patient_id
            description: "Unique patient identifier"
          - name: diagnosis_sequence
            description: "Sequence number of diagnosis"
          - name: diagnosis_coding_method
            description: "Coding method used (ICD-10, etc.)"
          - name: diagnosis_code
            description: "Diagnosis code"
          - name: diagnosis_description
            description: "Description of the diagnosis"
          - name: diagnosis_datetime
            description: "Date and time of diagnosis"
          - name: diagnosis_type
            description: "Type of diagnosis"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processed_at
            description: "Timestamp when record was processed"

      - name: file_processing_log
        description: "Log of HL7 file processing activities"
        columns:
          - name: s3_key
            description: "S3 object key"
          - name: file_name
            description: "Name of the processed file"
          - name: file_size
            description: "Size of the file in bytes"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processing_status
            description: "Status of file processing"
          - name: records_loaded
            description: "Number of records loaded from file"
          - name: error_message
            description: "Error message if processing failed"
          - name: processed_at
            description: "Timestamp when file was processed"
          - name: last_modified
            description: "Last modified timestamp of the file"

      - name: guarantors
        description: "Patient guarantor information from HL7 messages"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: patient_id
            description: "Unique patient identifier"
          - name: guarantor_number
            description: "Guarantor identification number"
          - name: guarantor_name
            description: "Name of the guarantor"
          - name: guarantor_address
            description: "Address of the guarantor"
          - name: guarantor_phone_home
            description: "Home phone number of guarantor"
          - name: guarantor_phone_business
            description: "Business phone number of guarantor"
          - name: guarantor_dob
            description: "Date of birth of guarantor"
          - name: guarantor_gender
            description: "Gender of the guarantor"
          - name: guarantor_relationship
            description: "Relationship to patient"
          - name: guarantor_ssn
            description: "Social Security Number of guarantor"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processed_at
            description: "Timestamp when record was processed"

      - name: hl7_messages
        description: "Raw HL7 messages and metadata"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: message_type
            description: "Type of HL7 message (ADT, ORM, etc.)"
          - name: message_event
            description: "Event type of the message"
          - name: sending_application
            description: "Application that sent the message"
          - name: sending_facility
            description: "Facility that sent the message"
          - name: receiving_application
            description: "Application receiving the message"
          - name: receiving_facility
            description: "Facility receiving the message"
          - name: message_datetime
            description: "Date and time of message creation"
          - name: message_control_id
            description: "Control ID for message tracking"
          - name: processing_id
            description: "Processing ID"
          - name: version_id
            description: "HL7 version identifier"
          - name: raw_message
            description: "Complete raw HL7 message"
          - name: file_name
            description: "Source file name"
          - name: source_folder
            description: "Source folder path in S3"
          - name: s3_path
            description: "Full S3 path to source file"
          - name: processed_at
            description: "Timestamp when message was processed"

      - name: insurance
        description: "Patient insurance information from HL7 messages"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: patient_id
            description: "Unique patient identifier"
          - name: insurance_plan_id
            description: "Insurance plan identifier"
          - name: insurance_company_name
            description: "Name of insurance company"
          - name: insurance_address
            description: "Address of insurance company"
          - name: phone_number
            description: "Phone number of insurance company"
          - name: group_name
            description: "Insurance group name"
          - name: insured_name
            description: "Name of insured person"
          - name: relationship
            description: "Relationship of insured to patient"
          - name: insured_dob
            description: "Date of birth of insured"
          - name: insured_address
            description: "Address of insured person"
          - name: plan_type
            description: "Type of insurance plan"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processed_at
            description: "Timestamp when record was processed"

      - name: notes
        description: "Clinical notes and comments from HL7 messages"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: patient_id
            description: "Unique patient identifier"
          - name: set_id
            description: "Set ID for the note"
          - name: source_of_comment
            description: "Source of the clinical comment"
          - name: comment
            description: "Clinical comment text"
          - name: comment_type
            description: "Type of comment"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processed_at
            description: "Timestamp when record was processed"

      - name: observations
        description: "Clinical observations and test results from HL7 messages"
        columns:
          - name: message_id
            description: "Unique identifier for the HL7 message"
          - name: patient_id
            description: "Unique patient identifier"
          - name: set_id
            description: "Set ID for the observation"
          - name: value_type
            description: "Type of observation value"
          - name: observation_id
            description: "Observation identifier"
          - name: observation_value
            description: "Value of the observation"
          - name: units
            description: "Units of measurement"
          - name: reference_range
            description: "Normal reference range"
          - name: abnormal_flags
            description: "Flags indicating abnormal results"
          - name: probability
            description: "Probability score"
          - name: nature_of_abnormal_test
            description: "Nature of abnormal test result"
          - name: observation_result_status
            description: "Status of the observation result"
          - name: observation_datetime
            description: "Date and time of observation"
          - name: observation_method
            description: "Method used for observation"
          - name: source_folder
            description: "Source folder path in S3"
          - name: processed_at
            description: "Timestamp when record was processed"

      - name: orders
        description: "Clinical orders from HL7 messages"
